          type: string
          description: The duration of the recording in seconds (conditional, only present if recording was enabled).
          example: '90'
        RecordingUrl:
          type: string
          description: The URL where the call recording can be accessed (conditional, only present if recording was enabled).
          example: https://api.telnyx.com/v2/recordings/abc123.wav
        SequenceNumber:
          type: integer
          description: The sequence number of the event.
          example: 3
        ShakenStirAttestation:
          type: string
          description: SHAKEN/STIR attestation level (conditional, only present if shaken_stir_data is available).
          example: A
        ShakenStirValidated:
          type: boolean
          description: Whether SHAKEN/STIR validation passed (conditional, only present if shaken_stir_data is available).
          example: true
        SipHangupCause:
          type: string
          description: The SIP hangup cause code (conditional, only present for hangup events).
          example: '200'
        StartTime:
          type: string
          format: date-time
          description: The time when the call started (only present when CallStatus is 'completed').
          example: '2024-01-15T10:30:00Z'
        Timestamp:
          type: string
          format: date-time
          description: The UTC timestamp when the webhook was generated.
          example: '2024-01-15T10:30:00Z'
        To:
          type: string
          description: The phone number or SIP address that was called.
          example: '+13129457420'
        UserId:
          type: string
          description: The user ID (only present when CallStatus is 'completed').
          example: f5586561-8ff0-4291-a51b-c7dfe4139ff9
      required:
        - AccountSid
        - CallInitiatedAt
        - CallSid
        - CallSidLegacy
        - CallStatus
        - From
        - To
        - ConnectionId
        - Timestamp
        - CallbackSource
        - SequenceNumber
