openapi: 3.1.0
info:
  title: Telnyx TeXML Calls API
  version: 2.0.0
  description: API for managing TeXML Calls.
  contact:
    email: support@telnyx.com
servers:
  - url: https://api.telnyx.com/v2
security:
  - bearerAuth: []
tags:
  - name: Command
    description: TeXML command operations
  - name: Callbacks
    description: Webhook callbacks for call events
paths:
  /texml/Accounts/{account_sid}/Calls:
    get:
      summary: Fetch multiple call resources
      description: Returns multiple call resouces for an account. This endpoint is eventually consistent.
      x-latency-category: responsive
      operationId: GetTexmlCalls
      tags:
        - TeXML REST Commands
      parameters:
        - $ref: '#/components/parameters/AccountSid'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/StartTime_gt'
        - $ref: '#/components/parameters/StartTime_lt'
        - $ref: '#/components/parameters/EndTime'
        - $ref: '#/components/parameters/EndTime_gt'
        - $ref: '#/components/parameters/EndTime_lt'
      responses:
        '200':
          description: Multiple call resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallResourceIndex'
        '404':
          $ref: '#/components/responses/call-scripting_NotFoundResponse'
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Telnyx from 'telnyx';

            const client = new Telnyx({
              apiKey: process.env['TELNYX_API_KEY'], // This is the default and can be omitted
            });

            const response = await client.texml.accounts.calls.retrieveCalls('account_sid');

            console.log(response.calls);
        - lang: Python
          source: |-
            import os
            from telnyx import Telnyx

            client = Telnyx(
                api_key=os.environ.get("TELNYX_API_KEY"),  # This is the default and can be omitted
            )
            response = client.texml.accounts.calls.retrieve_calls(
                account_sid="account_sid",
            )
            print(response.calls)
        - lang: Go
          source: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\n\t\"github.com/team-telnyx/telnyx-go\"\n\t\"github.com/team-telnyx/telnyx-go/option\"\n)\n\nfunc main() {\n\tclient := telnyx.NewClient(\n\t\toption.WithAPIKey(\"My API Key\"),\n\t)\n\tresponse, err := client.Texml.Accounts.Calls.GetCalls(\n\t\tcontext.TODO(),\n\t\t\"account_sid\",\n\t\ttelnyx.TexmlAccountCallGetCallsParams{},\n\t)\n\tif err != nil {\n\t\tpanic(err.Error())\n\t}\n\tfmt.Printf(\"%+v\\n\", response.Calls)\n}\n"
        - lang: Java
          source: |-
            package com.telnyx.sdk.example;

            import com.telnyx.sdk.client.TelnyxClient;
            import com.telnyx.sdk.client.okhttp.TelnyxOkHttpClient;
            import com.telnyx.sdk.models.texml.accounts.calls.CallRetrieveCallsParams;
            import com.telnyx.sdk.models.texml.accounts.calls.CallRetrieveCallsResponse;

            public final class Main {
                private Main() {}

                public static void main(String[] args) {
                    TelnyxClient client = TelnyxOkHttpClient.fromEnv();

                    CallRetrieveCallsResponse response = client.texml().accounts().calls().retrieveCalls("account_sid");
                }
            }
        - lang: Ruby
          source: |-
            require "telnyx"

            telnyx = Telnyx::Client.new(api_key: "My API Key")

            response = telnyx.texml.accounts.calls.retrieve_calls("account_sid")

            puts(response)
        - lang: PHP
          source: |-
            <?php

            require_once dirname(__DIR__) . '/vendor/autoload.php';

            use Telnyx\Client;
            use Telnyx\Core\Exceptions\APIException;

            $client = new Client(apiKey: getenv('TELNYX_API_KEY') ?: 'My API Key');

            try {
              $response = $client->texml->accounts->calls->retrieveCalls(
                'account_sid',
                endTime: 'EndTime',
                endTimeGt: 'EndTime_gt',
                endTimeLt: 'EndTime_lt',
                from: 'From',
                page: 0,
                pageSize: 0,
                pageToken: 'PageToken',
                startTime: 'StartTime',
                startTimeGt: 'StartTime_gt',
                startTimeLt: 'StartTime_lt',
                status: 'canceled',
                to: 'To',
              );

              var_dump($response);
            } catch (APIException $e) {
              echo $e->getMessage();
            }
        - lang: CLI
          source: |-
            telnyx texml:accounts:calls retrieve-calls \
              --api-key 'My API Key' \
              --account-sid account_sid
    post:
      summary: Initiate an outbound call
      description: Initiate an outbound TeXML call. Telnyx will request TeXML from the XML Request URL configured for the connection in the Mission Control Portal.
      x-latency-category: responsive
      x-group-parameters: 'true'
      operationId: InitiateTexmlCall
      tags:
        - TeXML REST Commands
      parameters:
        - $ref: '#/components/parameters/AccountSid'
      requestBody:
        description: Iniatiate Call request object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateCallRequest'
      responses:
        '200':
          description: Successful response upon initiating a TeXML call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiateCallResult'
        '422':
          $ref: '#/components/responses/call-scripting_UnprocessableEntityResponse'
